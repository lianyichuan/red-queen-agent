<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Red Queen Configuration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: linear-gradient(165deg, #1c060b, #120305);
      color: #ffd9d9; font-size: 13px; padding: 18px 20px; user-select: none;
    }
    h1 { font-size: 14px; letter-spacing: 3px; color: #ff8a8a; margin-bottom: 4px; }
    .env { font: 10px/1.6 "SF Mono", monospace; color: rgba(255,140,140,.6); margin-bottom: 14px; white-space: pre-line; }
    section { border: 1px solid rgba(255,90,90,.16); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    legend, .sec-title { font-size: 11px; color: #ff6a6a; letter-spacing: 2px; margin-bottom: 8px; }
    label { display: block; color: rgba(255,170,170,.8); margin: 8px 0 3px; }
    select, input[type=text] {
      width: 100%; height: 30px; padding: 0 8px; border-radius: 7px;
      border: 1px solid rgba(255,90,90,.22); background: rgba(255,60,60,.06);
      color: #ffe2e2; outline: none; font-size: 12px;
    }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .radios { display: flex; gap: 8px; }
    .radios label {
      flex: 1; display: flex; align-items: center; gap: 6px; margin: 0;
      border: 1px solid rgba(255,90,90,.18); border-radius: 8px; padding: 8px 10px; cursor: pointer;
    }
    .radios input { accent-color: #ff5a5a; }
    .radios label:has(input:checked) { border-color: rgba(255,110,110,.6); background: rgba(255,70,70,.10); }
    .radios .off { color: rgba(255,120,120,.35); font-size: 10px; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer; }
    .check input { accent-color: #ff5a5a; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    button.primary {
      height: 34px; padding: 0 26px; border-radius: 8px; border: 1px solid rgba(255,90,90,.4);
      background: rgba(255,70,70,.18); color: #ffe2e2; font-size: 13px; cursor: pointer; letter-spacing: 2px;
    }
    button.primary:hover { background: rgba(255,70,70,.32); }
    #toast { opacity: 0; transition: opacity .3s; color: #9dffb0; font-size: 12px; }
    #toast.show { opacity: 1; }
    small { color: rgba(255,140,140,.45); }
  </style>
  <link rel="stylesheet" href="settings-theme.css" /><link rel="stylesheet" href="appearance.css" />
</head>
<body>
  <h1>RED QUEEN · CONFIGURATION</h1>
  <div class="env" id="env"></div>

  <section id="appearance-controls"></section>

  <section>
    <div class="sec-title">EXECUTION ENGINE</div>
    <div class="radios">
      <label><input type="radio" name="executor" value="codex" /> Codex CLI <span class="off" id="st-codex"></span></label>
      <label><input type="radio" name="executor" value="claude" /> Claude Code <span class="off" id="st-claude"></span></label>
    </div>

    <div class="row">
      <div>
        <label>Codex model · Blank follows active profile</label>
        <input type="text" id="codex-model" list="codex-models" />
        <datalist id="codex-models"></datalist>
      </div>
      <div>
        <label>Reasoning effort</label>
        <select id="codex-effort">
          <option value="low">Low · Fast</option>
          <option value="medium">medium</option>
          <option value="high">High · Deliberate</option>
        </select>
      </div>
    </div>
    <label>Execution sandbox</label>
    <select id="codex-sandbox">
      <option value="read-only">Read only</option>
      <option value="workspace-write">Workspace access</option>
      <option value="danger-full-access">Full system access</option>
    </select>

    <div class="row">
      <div>
        <label>Claude model · Blank uses default</label>
        <input type="text" id="claude-model" placeholder="sonnet / opus / model ID" />
      </div>
      <div>
        <label>Claude permission mode</label>
        <select id="claude-perm">
          <option value="acceptEdits">acceptEdits</option>
          <option value="auto">auto</option>
          <option value="bypassPermissions">bypassPermissions</option>
        </select>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-title">VOICE OUTPUT</div>
    <label>Synthesis voice · edge-tts</label>
    <select id="tts-voice">
      <option value="zh-CN-XiaoyiNeural">Xiaoyi · Mandarin</option>
      <option value="zh-CN-XiaoxiaoNeural">Xiaoxiao · Mandarin</option>
      <option value="zh-CN-YunxiNeural">Yunxi · Mandarin</option>
      <option value="zh-CN-YunyangNeural">Yunyang · Mandarin</option>
      <option value="zh-HK-HiuMaanNeural">HiuMaan · Cantonese</option>
      <option value="zh-TW-HsiaoChenNeural">HsiaoChen · Mandarin / Taiwan</option>
      <option value="en-GB-SoniaNeural">Sonia · English / UK</option>
      <option value="en-US-JennyNeural">Jenny · English / US</option>
    </select>
    <label for="tts-rate">SPEECH RATE <output id="tts-rate-value">115%</output></label>
    <input type="range" id="tts-rate" aria-label="Speech rate" min="-50" max="100" step="5" value="15" style="width:100%;accent-color:#cf607b" />
    <small>100% = normal speed · Applies to the next reply</small>
    <label class="check"><input type="checkbox" id="tts-redqueen" /> Red Queen tone · Cool and restrained</label>
  </section>

  <section>
    <div class="sec-title">INPUT</div>
    <label>Text input auto-transmit delay · ms</label>
    <input type="text" id="auto-send" />
  </section>

  <div class="actions">
    <button class="primary" id="save">APPLY</button>
    <span id="toast">APPLIED ✓</span>
    <small>Changes apply immediately</small>
  </div>

  <script src="appearance.js"></script>
  <script src="settings.js"></script>
</body>
</html>
